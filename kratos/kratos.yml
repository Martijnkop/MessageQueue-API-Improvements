version: v1.3.0

# database connection
dsn: "postgres://kratos:password@kratosdb:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4"

serve:
  public:
    base_url: http://localhost:4433
    cors:
      enabled: true
      allowed_origins:
        - http://localhost:5173
      allowed_methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - Accept
        - Cookie
      exposed_headers:
        - Content-Type
        - Set-Cookie
      allow_credentials: true
  admin:
    base_url: http://localhost:4434

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

selfservice:
  default_browser_return_url: http://localhost:5173/
  allowed_return_urls:
    - http://localhost:5173
    - http://localhost:4455

  methods:
    password:
      enabled: true
    totp:
      enabled: false

  flows:
    error:
      ui_url: http://localhost:5173/error

    settings:
      ui_url: http://localhost:5173/settings
      lifespan: 1h
      privileged_session_max_age: 1h
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://localhost:5173/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://localhost:5173/verification
      use: code
      after:
        default_browser_return_url: http://localhost:5173

    logout:
      after:
        default_browser_return_url: http://localhost:5173/login

    login:
      ui_url: http://localhost:5173/login
      lifespan: 10m

    registration:
      ui_url: http://localhost:5173/register
      lifespan: 1h
      after:
        password:
          hooks:
            - hook: session
            - hook: show_verification_ui

log:
  level: debug
  format: text
  leak_sensitive_values: true
