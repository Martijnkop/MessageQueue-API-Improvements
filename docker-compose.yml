services:
  database:
    container_name: database
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: database
    volumes:
      - ./database/v1:/var/lib/postgresql
    networks:
      - social_network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: social_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://socialkeycloakdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    depends_on:
      - keycloakdb
    ports:
      - 8080:8080
    networks:
      - social_network

  keycloakdb:
    image: postgres:latest
    container_name: socialkeycloakdb
    volumes:
      - keycloakdb_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - social_network

volumes:
  keycloakdb_data:

networks:
  social_network:
    name: social
    external: true