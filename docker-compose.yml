services:
  database:
    container_name: database_social
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: database
    volumes:
      - ./database/v1:/var/lib/postgresql
    networks:
      - social_network

  kratos_migrate:
    image: oryd/kratos:latest
    restart: on-failure
    environment:
      DSN: postgres://kratos:password@kratosdb_social:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    networks:
      - kratos_internal
    volumes:
      - ./kratos:/etc/config/kratos
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes

  kratos:
    container_name: kratos_social
    image: oryd/kratos:latest
    depends_on:
      - kratos_migrate
    environment:
      DSN: postgres://kratos:password@kratosdb_social:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4-
    ports:
      - 4433:4433 # public
      - 4434:4434 # admin
    networks:
      - kratos_internal
      - social_network
    volumes:
      - ./kratos:/etc/config/kratos
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier

  kratos_ui:
    image: oryd/kratos-selfservice-ui-node:latest
    environment:
      KRATOS_PUBLIC_URL: http://kratos:4433/
      KRATOS_BROWSER_URL: http://localhost:4433/
      PORT: 4455
      COOKIE_SECRET: testasdf
      CSRF_COOKIE_NAME: barboek
      CSRF_COOKIE_SECRET: asdfasdf
    networks:
      - kratos_internal
    ports:
      - 4455:4455

  kratos_db:
    container_name: kratosdb_social
    image: postgres:latest
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: kratos
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kratos
    networks:
      - kratos_internal


volumes:
  kratos_data:

networks:
  social_network:
    name: social
    external: true
  kratos_internal:
